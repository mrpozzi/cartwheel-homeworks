name: evals

on:
  push:
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # Homework 6: install Harbor 0.23.0.
      - name: Install Harbor
        run: |
          uv tool install 'harbor==0.23.0'
          harbor --version

      # Generate the classified tasks in eval_cases/cases.jsonl.
      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # Run five attempts per task in fresh Docker containers.
      # Pass the agent and judge provider keys to Harbor: they are in the job
      # environment above, and the generated task.toml forwards the judge key
      # to the verifier.
      - name: Run every task five times with Harbor
        run: |
          test -n "$CARTWHEEL_MODEL" || { echo "Set the CARTWHEEL_MODEL repository variable"; exit 1; }
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir "$GITHUB_WORKSPACE/.harbor/jobs" \
            --yes

      # Summarize the job and upload the job files with `if: always()` so a
      # failed regression keeps its evidence.
      - name: Summarize the job and apply the CI gate
        if: always()
        run: uv run python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5

      - name: Upload the Harbor job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          include-hidden-files: true
          if-no-files-found: warn
